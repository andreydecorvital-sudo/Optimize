name: Import SystemManager upstream

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'agent/systemmanager-base'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: agent/systemmanager-base
          fetch-depth: 0

      - name: Import trusted upstream source
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_URL="https://github.com/laurentiu021/SystemManager.git"
          UPSTREAM_DIR="$RUNNER_TEMP/SystemManager"

          git clone --depth 1 "$UPSTREAM_URL" "$UPSTREAM_DIR"
          UPSTREAM_SHA="$(git -C "$UPSTREAM_DIR" rev-parse HEAD)"

          # Replace the experimental prototype on the import branch.
          # Never import upstream workflow files into this repository.
          git rm -r -f . || true
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$UPSTREAM_DIR/" ./

          rm -rf .github/workflows

          cat > UPSTREAM.md <<EOF
          # Upstream base

          Optimize is based on the MIT-licensed SystemManager project.

          - Upstream repository: https://github.com/laurentiu021/SystemManager
          - Imported commit: $UPSTREAM_SHA
          - Import date: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          The upstream LICENSE file is preserved. Optimize-specific changes are
          developed on top of this baseline.
          EOF

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi

          git commit -m "Import SystemManager upstream [vendor-systemmanager]"
          git push origin HEAD:agent/systemmanager-base
