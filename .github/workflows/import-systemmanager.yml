name: Import SystemManager upstream

on:
  push:
    branches:
      - "agent/systemmanager-base"
    paths:
      - ".github/workflows/import-systemmanager.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Optimize
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import trusted upstream source
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_URL="https://github.com/laurentiu021/SystemManager.git"
          UPSTREAM_DIR="$RUNNER_TEMP/SystemManager"
          IMPORT_WORKFLOW="$RUNNER_TEMP/import-systemmanager.yml"

          cp .github/workflows/import-systemmanager.yml "$IMPORT_WORKFLOW"
          git clone --depth 1 "$UPSTREAM_URL" "$UPSTREAM_DIR"
          UPSTREAM_SHA="$(git -C "$UPSTREAM_DIR" rev-parse HEAD)"

          # Replace the experimental Optimize prototype with the upstream source.
          # Upstream GitHub Actions workflows are deliberately excluded so no
          # third-party automation executes with permissions in this repository.
          git rm -r -f . || true
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$UPSTREAM_DIR/" ./

          mkdir -p .github/workflows
          cp "$IMPORT_WORKFLOW" .github/workflows/import-systemmanager.yml

          cat > UPSTREAM.md <<EOF
          # Upstream base

          Optimize is currently based on the MIT-licensed SystemManager project.

          - Upstream repository: https://github.com/laurentiu021/SystemManager
          - Imported commit: $UPSTREAM_SHA
          - Imported automatically by: .github/workflows/import-systemmanager.yml

          The upstream LICENSE file is preserved in this repository. Optimize-specific
          changes will be developed on top of this imported baseline.
          EOF

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi

          git commit -m "Import SystemManager upstream [vendor-systemmanager]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
